packages:
  - "apps/*"
  - "packages/*"

overrides:
  fastify: 5.12.8
  # Patched releases of vulnerable transitive build and test tooling (pnpm audit).
  js-yaml@3: ^3.15.2
  brace-expansion@1: ^1.1.20
  brace-expansion@2: ^2.1.6
  browserslist: ^4.28.7
  markdown-it@14: ^14.3.3
  # Same API, patched minimatch: @fastify/static only globs its own root with fixed patterns.
  '@fastify/static>glob': ^14.0.3
  # drizzle-kit ships in the API image for migrations and only uses esbuild to load the config
  # and schema. The esbuild 0.25 binaries are built with a Go release that has known
  # vulnerabilities, which the image scan reports.
  'drizzle-kit>esbuild': ^0.28.2
  '@esbuild-kit/core-utils>esbuild': ^0.28.2

allowBuilds:
  '@parcel/watcher': false
  '@scarf/scarf': true
  esbuild: true
  unrs-resolver: true

minimumReleaseAgeExclude:
  - '@better-auth/core@1.6.34'
  - '@better-auth/drizzle-adapter@1.6.34'
  - '@better-auth/kysely-adapter@1.6.34'
  - '@better-auth/memory-adapter@1.6.34'
  - '@better-auth/mongo-adapter@1.6.34'
  - '@better-auth/prisma-adapter@1.6.34'
  - '@better-auth/telemetry@1.6.34'
  - better-auth@1.6.34
