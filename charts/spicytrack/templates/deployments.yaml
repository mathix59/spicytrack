{{- $root := . }}
{{- $components := list
  (dict "name" "api-web" "values" .Values.apiWeb "image" .Values.images.apiWeb "port" 3000 "secret" .Values.env.existingSecrets.apiWeb)
  (dict "name" "api-ingest" "values" .Values.apiIngest "image" .Values.images.apiIngest "port" 3001 "secret" .Values.env.existingSecrets.apiIngest)
  (dict "name" "worker-admin" "values" .Values.workerAdmin "image" .Values.images.workerAdmin "secret" .Values.env.existingSecrets.workerAdmin)
  (dict "name" "web" "values" .Values.web "image" .Values.images.web "port" 8080)
}}
{{- range $component := $components }}
{{- $name := include "spicytrack.componentName" (dict "root" $root "component" $component.name) }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "spicytrack.labels" $root | nindent 4 }}
    app.kubernetes.io/component: {{ $component.name }}
spec:
  replicas: {{ $component.values.replicaCount }}
  selector:
    matchLabels:
      {{- include "spicytrack.selectorLabels" $root | nindent 6 }}
      app.kubernetes.io/component: {{ $component.name }}
  template:
    metadata:
      annotations:
        {{- toYaml $root.Values.podAnnotations | nindent 8 }}
      labels:
        {{- include "spicytrack.selectorLabels" $root | nindent 8 }}
        app.kubernetes.io/component: {{ $component.name }}
        {{- with $root.Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      securityContext:
        {{- toYaml $root.Values.podSecurityContext | nindent 8 }}
      {{- with $root.Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if or (eq $component.name "web") (and (or (and $root.Values.postgresql.enabled $root.Values.migrations.enabled) $root.Values.objectStorage.enabled) (ne $component.name "web")) }}
      initContainers:
        {{- if eq $component.name "web" }}
        - name: wait-for-api-dns
          image: "{{ $component.image.repository }}@{{ required "images.web.digest is required" $component.image.digest }}"
          imagePullPolicy: {{ $component.image.pullPolicy }}
          securityContext:
            {{- toYaml $root.Values.containerSecurityContext | nindent 12 }}
          command: ["sh", "-ec"]
          args:
            - |
              attempts=0
              until nslookup "{{ include "spicytrack.componentName" (dict "root" $root "component" "api-web") }}.{{ $root.Release.Namespace }}.svc.cluster.local" >/dev/null 2>&1 \
                && nslookup "{{ include "spicytrack.componentName" (dict "root" $root "component" "api-ingest") }}.{{ $root.Release.Namespace }}.svc.cluster.local" >/dev/null 2>&1; do
                attempts=$((attempts + 1))
                if [ "$attempts" -ge 60 ]; then
                  echo "API service DNS records were not available after 120 seconds" >&2
                  exit 1
                fi
                sleep 2
              done
        {{- else }}
        {{- if and $root.Values.postgresql.enabled $root.Values.migrations.enabled }}
        - name: wait-for-migrations
          image: "{{ $root.Values.images.apiWeb.repository }}@{{ required "images.apiWeb.digest is required" $root.Values.images.apiWeb.digest }}"
          imagePullPolicy: {{ $root.Values.images.apiWeb.pullPolicy }}
          workingDir: /app/apps/api
          securityContext:
            {{- toYaml $root.Values.containerSecurityContext | nindent 12 }}
          command: ["node", "-e"]
          args:
            - |
              const { Client } = require("pg");
              const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
              (async () => {
                for (;;) {
                  const client = new Client({ connectionString: process.env.DATABASE_URL });
                  try {
                    await client.connect();
                    const result = await client.query("SELECT 1 FROM _spicytrack_helm_migrations WHERE revision = $1", [Number(process.env.HELM_RELEASE_REVISION)]);
                    if (result.rowCount === 1) return;
                  } catch (error) {
                    console.log(`Waiting for Helm migration ${process.env.HELM_RELEASE_REVISION}: ${error.message}`);
                  } finally {
                    await client.end().catch(() => undefined);
                  }
                  await sleep(2000);
                }
              })().catch((error) => { console.error(error); process.exit(1); });
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "spicytrack.postgresqlSecretName" $root }}
                  key: {{ $root.Values.postgresql.auth.databaseUrlKey }}
            - name: HELM_RELEASE_REVISION
              value: {{ $root.Release.Revision | quote }}
        {{- end }}
        {{- if $root.Values.objectStorage.enabled }}
        - name: ensure-artifact-bucket
          image: "{{ $root.Values.images.apiWeb.repository }}@{{ required "images.apiWeb.digest is required" $root.Values.images.apiWeb.digest }}"
          imagePullPolicy: {{ $root.Values.images.apiWeb.pullPolicy }}
          workingDir: /app/apps/api
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1000
            capabilities: { drop: ["ALL"] }
          command: ["node", "-e"]
          args:
            - |
              const { S3Client, HeadBucketCommand, CreateBucketCommand } = require("@aws-sdk/client-s3");
              const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
              const client = new S3Client({
                endpoint: process.env.STORAGE_ENDPOINT,
                region: process.env.STORAGE_REGION,
                forcePathStyle: true,
                credentials: {
                  accessKeyId: process.env.STORAGE_ACCESS_KEY_ID,
                  secretAccessKey: process.env.STORAGE_SECRET_ACCESS_KEY,
                },
              });
              (async () => {
                for (;;) {
                  try {
                    await client.send(new HeadBucketCommand({ Bucket: process.env.STORAGE_BUCKET }));
                    return;
                  } catch (headError) {
                    try {
                      await client.send(new CreateBucketCommand({ Bucket: process.env.STORAGE_BUCKET }));
                      return;
                    } catch (createError) {
                      if (["BucketAlreadyOwnedByYou", "BucketAlreadyExists"].includes(createError.name)) return;
                      console.log(`Waiting for RustFS: ${createError.message}`);
                    }
                  }
                  await sleep(2000);
                }
              })().catch((error) => { console.error(error); process.exit(1); });
          env:
            - name: STORAGE_ENDPOINT
              value: {{ printf "http://%s:%v" (include "spicytrack.objectStorageName" $root) $root.Values.objectStorage.service.port | quote }}
            - name: STORAGE_BUCKET
              value: {{ $root.Values.objectStorage.bucket | quote }}
            - name: STORAGE_REGION
              value: {{ $root.Values.objectStorage.region | quote }}
            - name: STORAGE_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: {{ include "spicytrack.objectStorageSecretName" $root }}
                  key: {{ $root.Values.objectStorage.auth.accessKeyKey }}
            - name: STORAGE_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "spicytrack.objectStorageSecretName" $root }}
                  key: {{ $root.Values.objectStorage.auth.secretKeyKey }}
        {{- end }}
        {{- end }}
      {{- end }}
      containers:
        - name: {{ $component.name }}
          image: "{{ $component.image.repository }}@{{ required (printf "images.%s.digest is required" $component.name) $component.image.digest }}"
          imagePullPolicy: {{ $component.image.pullPolicy }}
          securityContext:
            {{- toYaml $root.Values.containerSecurityContext | nindent 12 }}
          {{- with $component.secret }}
          envFrom:
            - secretRef:
                name: {{ required (printf "a Secret is required for %s" $component.name) . }}
          {{- end }}
          {{- if or (and $component.port (ne $component.name "web")) (and $root.Values.postgresql.enabled (ne $component.name "web")) (and $root.Values.objectStorage.enabled (ne $component.name "web")) }}
          env:
            {{- if and $component.port (ne $component.name "web") }}
            - name: PORT
              value: {{ $component.port | quote }}
            {{- end }}
            {{- if and $root.Values.postgresql.enabled (ne $component.name "web") }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "spicytrack.postgresqlSecretName" $root }}
                  key: {{ $root.Values.postgresql.auth.databaseUrlKey }}
            {{- end }}
            {{- if and $root.Values.objectStorage.enabled (ne $component.name "web") }}
            - name: STORAGE_ENDPOINT
              value: {{ printf "http://%s:%v" (include "spicytrack.objectStorageName" $root) $root.Values.objectStorage.service.port | quote }}
            - name: STORAGE_REGION
              value: {{ $root.Values.objectStorage.region | quote }}
            - name: STORAGE_BUCKET
              value: {{ $root.Values.objectStorage.bucket | quote }}
            - name: STORAGE_FORCE_PATH_STYLE
              value: "true"
            - name: STORAGE_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: {{ include "spicytrack.objectStorageSecretName" $root }}
                  key: {{ $root.Values.objectStorage.auth.accessKeyKey }}
            - name: STORAGE_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "spicytrack.objectStorageSecretName" $root }}
                  key: {{ $root.Values.objectStorage.auth.secretKeyKey }}
            {{- end }}
          {{- end }}
          {{- if $component.port }}
          ports:
            - name: http
              containerPort: {{ $component.port }}
          {{- end }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          {{- if eq $component.name "web" }}
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
          livenessProbe:
            httpGet: { path: /, port: http }
          readinessProbe:
            httpGet: { path: /, port: http }
          {{- else if ne $component.name "worker-admin" }}
          livenessProbe:
            httpGet: { path: /api/health/live, port: http }
          readinessProbe:
            httpGet: { path: /api/health/ready, port: http }
          {{- end }}
          resources:
            {{- toYaml $component.values.resources | nindent 12 }}
      volumes:
        - name: tmp
          emptyDir: {}
      {{- if eq $component.name "web" }}
        - name: nginx-config
          configMap:
            name: {{ include "spicytrack.fullname" $root }}-nginx
      {{- end }}
      nodeSelector:
        {{- toYaml $root.Values.nodeSelector | nindent 8 }}
      tolerations:
        {{- toYaml $root.Values.tolerations | nindent 8 }}
      affinity:
        {{- toYaml $root.Values.affinity | nindent 8 }}
---
{{- end }}
