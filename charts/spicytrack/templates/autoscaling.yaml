{{- $root := . }}
{{- range $component := list (dict "name" "api-web" "values" .Values.apiWeb) (dict "name" "api-ingest" "values" .Values.apiIngest) (dict "name" "worker-admin" "values" .Values.workerAdmin) (dict "name" "web" "values" .Values.web) }}
{{- if $component.values.autoscaling.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "spicytrack.componentName" (dict "root" $root "component" $component.name) }}
  labels:
    {{- include "spicytrack.labels" $root | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "spicytrack.componentName" (dict "root" $root "component" $component.name) }}
  minReplicas: {{ $component.values.autoscaling.minReplicas }}
  maxReplicas: {{ $component.values.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ $component.values.autoscaling.targetCPUUtilizationPercentage }}
---
{{- end }}
{{- end }}
