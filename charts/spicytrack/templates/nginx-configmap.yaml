apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "spicytrack.fullname" . }}-nginx
  labels:
    {{- include "spicytrack.labels" . | nindent 4 }}
data:
  default.conf: |
    map $http_x_forwarded_proto $spicytrack_forwarded_proto {
      default $http_x_forwarded_proto;
      "" $scheme;
    }

    map $spicytrack_forwarded_proto $spicytrack_hsts {
      default "";
      https "max-age=31536000; includeSubDomains";
    }

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    server {
      listen 8080;
      server_name _;
      root /usr/share/nginx/html;
      index index.html;

      add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self'" always;
      add_header Strict-Transport-Security $spicytrack_hsts always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header X-Frame-Options "DENY" always;
      add_header Referrer-Policy "no-referrer" always;
      add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

      location ~ ^/api/[^/]+/(store|envelope)/?$ {
        proxy_pass http://{{ include "spicytrack.fullname" . }}-api-ingest:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $spicytrack_forwarded_proto;
      }

      location /api/ {
        proxy_pass http://{{ include "spicytrack.fullname" . }}-api-web:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $spicytrack_forwarded_proto;
      }

      location /docs/ {
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self'" always;
        add_header Strict-Transport-Security $spicytrack_hsts always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        proxy_pass http://{{ include "spicytrack.fullname" . }}-api-web:3000/docs/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $spicytrack_forwarded_proto;
      }

      location / { try_files $uri $uri/ /index.html; }
    }
