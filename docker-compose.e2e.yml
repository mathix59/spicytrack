name: spicytrack-e2e

x-api-environment: &api-environment
  DATABASE_URL: postgresql://spicytrack:spicytrack@postgres:5432/spicytrack
  # Same server, but PostgreSQL enforces a read-only session. This proves that
  # Drizzle never routes mutations or transactions through the replica client.
  DATABASE_READ_REPLICA_URL: postgresql://spicytrack:spicytrack@postgres:5432/spicytrack?options=-c%20default_transaction_read_only%3Don&application_name=spicytrack-read-replica
  WEB_ORIGIN: http://127.0.0.1:55174,http://127.0.0.1:55880
  PUBLIC_BASE_URL: http://127.0.0.1:55174
  WEB_BASE_URL: http://127.0.0.1:55174
  BETTER_AUTH_URL: http://127.0.0.1:55174/api/better-auth
  BETTER_AUTH_SECRET: spicytrack-e2e-secret-at-least-32-characters
  AUTH_PASSWORD_ENABLED: "true"
  OIDC_DISCOVERY_URL: http://keycloak.test:58080/realms/spicytrack/.well-known/openid-configuration
  OIDC_CLIENT_ID: spicytrack-e2e
  OIDC_CLIENT_SECRET: spicytrack-e2e-secret
  OIDC_PROVIDER_ID: keycloak
  OIDC_PROVIDER_NAME: Keycloak
  OIDC_ACCESS_MODE: invited
  OIDC_REQUIRE_VERIFIED_EMAIL: "true"
  INGEST_MAX_EVENT_BYTES: "1000000"
  ARTIFACT_MAX_UPLOAD_BYTES: "5242880"
  INGEST_PROJECT_EVENTS_PER_HOUR: "0"
  INGEST_ORGANIZATION_EVENTS_PER_HOUR: "0"
  STORAGE_ENDPOINT: http://rustfs:9000
  STORAGE_REGION: us-east-1
  STORAGE_ACCESS_KEY_ID: spicytrack
  STORAGE_SECRET_ACCESS_KEY: spicytrack-e2e-secret
  STORAGE_BUCKET: spicytrack-e2e-artifacts
  STORAGE_FORCE_PATH_STYLE: "true"
  SECRETS_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: spicytrack
      POSTGRES_USER: spicytrack
      POSTGRES_PASSWORD: spicytrack
    ports:
      - "127.0.0.1:55433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./e2e:/e2e:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spicytrack -d spicytrack"]
      interval: 2s
      timeout: 3s
      retries: 30

  rustfs:
    image: rustfs/rustfs:latest
    platform: linux/amd64
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ENABLE: "false"
      RUSTFS_ACCESS_KEY: spicytrack
      RUSTFS_SECRET_KEY: spicytrack-e2e-secret
    ports:
      - "127.0.0.1:59002:9000"
    volumes:
      - rustfs_data:/data

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "127.0.0.1:51025:1025"
      - "127.0.0.1:58025:8025"

  keycloak:
    image: quay.io/keycloak/keycloak:26.4.2
    command: ["start-dev", "--import-realm", "--http-port=58080", "--health-enabled=true"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: spicytrack-e2e-admin
      KC_HOSTNAME: http://keycloak.test:58080
    ports:
      - "127.0.0.1:58080:58080"
    volumes:
      - ./e2e/keycloak-realm.json:/opt/keycloak/data/import/spicytrack-realm.json:ro
    networks:
      default:
        aliases:
          - keycloak.test
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/58080"]
      interval: 3s
      timeout: 5s
      retries: 40
      start_period: 15s

  sdk-node:
    profiles: ["sdk-tests"]
    build: ./e2e/sdk-matrix/node
    environment:
      SPICYTRACK_DSN: ${E2E_SDK_DSN:-http://missing@web/0}
    depends_on:
      web:
        condition: service_healthy

  sdk-browser:
    build: ./e2e/sdk-matrix/browser
    ports:
      - "127.0.0.1:55880:80"
    depends_on:
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/"]
      interval: 2s
      timeout: 3s
      retries: 20

  sdk-python:
    profiles: ["sdk-tests"]
    build: ./e2e/sdk-matrix/python
    environment:
      SPICYTRACK_DSN: ${E2E_SDK_DSN:-http://missing@web/0}
    depends_on:
      web:
        condition: service_healthy

  sdk-go:
    profiles: ["sdk-tests"]
    build: ./e2e/sdk-matrix/go
    environment:
      SPICYTRACK_DSN: ${E2E_SDK_DSN:-http://missing@web/0}
    depends_on:
      web:
        condition: service_healthy

  sdk-java:
    profiles: ["sdk-tests"]
    build: ./e2e/sdk-matrix/java
    environment:
      SPICYTRACK_DSN: ${E2E_SDK_DSN:-http://missing@web/0}
    depends_on:
      web:
        condition: service_healthy

  sdk-dotnet:
    profiles: ["sdk-tests"]
    build: ./e2e/sdk-matrix/dotnet
    environment:
      SPICYTRACK_DSN: ${E2E_SDK_DSN:-http://missing@web/0}
    depends_on:
      web:
        condition: service_healthy

  sdk-php:
    profiles: ["sdk-tests"]
    build: ./e2e/sdk-matrix/php
    environment:
      SPICYTRACK_DSN: ${E2E_SDK_DSN:-http://missing@web/0}
    depends_on:
      web:
        condition: service_healthy

  sdk-ruby:
    profiles: ["sdk-tests"]
    build: ./e2e/sdk-matrix/ruby
    environment:
      SPICYTRACK_DSN: ${E2E_SDK_DSN:-http://missing@web/0}
    depends_on:
      web:
        condition: service_healthy

  sdk-rust:
    profiles: ["sdk-tests"]
    build: ./e2e/sdk-matrix/rust
    environment:
      SPICYTRACK_DSN: ${E2E_SDK_DSN:-http://missing@web/0}
    depends_on:
      web:
        condition: service_healthy

  sdk-dart:
    profiles: ["sdk-tests"]
    build: ./e2e/sdk-matrix/dart
    environment:
      SPICYTRACK_DSN: ${E2E_SDK_DSN:-http://missing@web/0}
    depends_on:
      web:
        condition: service_healthy

  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: api-web
    environment: *api-environment
    depends_on:
      postgres:
        condition: service_healthy
      rustfs:
        condition: service_started
      mailpit:
        condition: service_started
    working_dir: /app/apps/api
    command:
      ["node", "node_modules/drizzle-kit/bin.cjs", "migrate", "--config", "drizzle.config.ts"]

  configure:
    image: postgres:17-alpine
    environment:
      PGPASSWORD: spicytrack
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      - ./e2e/bootstrap.sql:/bootstrap.sql:ro
    command: ["psql", "-h", "postgres", "-U", "spicytrack", "-d", "spicytrack", "-f", "/bootstrap.sql"]

  api-web:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: api-web
    environment:
      <<: *api-environment
      PORT: 3000
      INGEST_BASE_URL: http://127.0.0.1:55174
    depends_on:
      configure:
        condition: service_completed_successfully
      keycloak:
        condition: service_healthy
    ports:
      - "127.0.0.1:53000:3000"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:3000/api/health/live"]
      interval: 3s
      timeout: 5s
      retries: 30

  api-ingest:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: api-ingest
    environment:
      <<: *api-environment
      PORT: 3001
    depends_on:
      configure:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:53001:3001"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:3001/api/health/live"]
      interval: 3s
      timeout: 5s
      retries: 30

  api-worker-admin:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: api-worker-admin
    environment: *api-environment
    depends_on:
      configure:
        condition: service_completed_successfully

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    depends_on:
      api-web:
        condition: service_healthy
      api-ingest:
        condition: service_healthy
    ports:
      - "127.0.0.1:55174:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  postgres_data:
  rustfs_data:
