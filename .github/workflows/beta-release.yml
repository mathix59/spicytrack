name: Beta Release

# Cuts the next prerelease (1.2.0-beta.N) from the beta branch, on demand: versions the pending
# changesets in pre mode, tags, publishes prerelease notes and the beta images. Stable releases
# stay on main (changesets.yml).
on:
  workflow_dispatch:

permissions:
  actions: write
  contents: write

concurrency:
  group: beta-release
  cancel-in-progress: false

jobs:
  release-beta:
    if: github.ref == 'refs/heads/beta'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Require prerelease mode
        run: |
          if [ ! -f .changeset/pre.json ]; then
            echo "::error::beta is not in prerelease mode. Run 'pnpm changeset:pre:enter:beta' on beta first."
            exit 1
          fi
          if [ "$(jq -r .mode .changeset/pre.json)" != pre ]; then
            echo "::error::beta has left prerelease mode; merge it into main for the stable release."
            exit 1
          fi

      - name: Require a green CI run for this commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          passed="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${GITHUB_SHA}&status=success" --jq '.total_count')"
          if [ "${passed}" = 0 ]; then
            echo "::error::CI has not passed on ${GITHUB_SHA}. Wait for it, or fix it, before cutting a beta."
            exit 1
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Version packages
        id: version
        run: |
          pnpm changeset:version
          VERSION="v$(node -p "require('./apps/api/package.json').version")"
          if git diff --quiet; then
            echo "::error::No pending changeset since the last beta (${VERSION}). Add one before cutting a beta."
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Commit the version and tag it
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(release): ${VERSION}"
          git push origin HEAD:beta
          pnpm release:tag:push

      - name: Publish prerelease notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          node scripts/render-release-notes.mjs "${VERSION#v}" > /tmp/release-notes.md
          gh release create "${VERSION}" --verify-tag --prerelease --title "${VERSION}" \
            --notes-file /tmp/release-notes.md

      # Pushed tags do not start workflows when GITHUB_TOKEN pushes them, so the images are
      # requested explicitly, from the tag.
      - name: Publish beta images
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: gh workflow run docker-publish.yml --ref "${VERSION}" -f version="${VERSION}"
