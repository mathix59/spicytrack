name: Docker Publish

on:
  push:
    tags:
      - "v*"
  workflow_run:
    workflows: [Version Packages]
    types: [completed]
  workflow_dispatch:
    inputs:
      version:
        description: "Release version to publish (e.g. 1.0.8 or v1.0.8). Defaults to latest workspace version."
        required: false
        default: ""
        type: string

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  publish-api:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        target:
          - api-web
          - api-ingest
          - api-worker-admin

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolve release version
        id: release
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            VERSION="v$(node -e "const fs = require('fs'); process.stdout.write(JSON.parse(fs.readFileSync('apps/api/package.json', 'utf8')).version);")"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
            if [ -z "$VERSION" ]; then
              VERSION="v$(node -e "const fs = require('fs'); process.stdout.write(JSON.parse(fs.readFileSync('apps/api/package.json', 'utf8')).version);")"
            fi
          else
            VERSION="${GITHUB_REF_NAME}"
          fi

          VERSION_NO_V="${VERSION#v}"
          MAJOR="${VERSION_NO_V%%.*}"
          MINOR="$(printf '%s' "$VERSION_NO_V" | cut -d. -f2)"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "version_no_v=${VERSION_NO_V}" >> "$GITHUB_OUTPUT"
          echo "major=${MAJOR}" >> "$GITHUB_OUTPUT"
          echo "minor=${MINOR}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@v4.1.2

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/mathix59/spicytrack-${{ matrix.target }}
          tags: |
            type=raw,value=${{ steps.release.outputs.version }}
            type=raw,value=${{ steps.release.outputs.version_no_v }}
            type=raw,value=${{ steps.release.outputs.major }}.${{ steps.release.outputs.minor }}
            type=raw,value=${{ steps.release.outputs.major }}
            type=sha
            type=raw,value=latest

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/api/Dockerfile
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true

      - name: Verify multi-architecture manifest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE: ghcr.io/mathix59/spicytrack-${{ matrix.target }}
        run: |
          docker buildx imagetools inspect "${IMAGE}@${DIGEST}" --raw > /tmp/manifest.json
          jq -e '
            [.manifests[].platform | select(.os == "linux") | .architecture] as $architectures
            | ($architectures | index("amd64")) != null
              and ($architectures | index("arm64")) != null
          ' /tmp/manifest.json

      - name: Sign image digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE: ghcr.io/mathix59/spicytrack-${{ matrix.target }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

  publish-web:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolve release version
        id: release
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            VERSION="v$(node -e "const fs = require('fs'); process.stdout.write(JSON.parse(fs.readFileSync('apps/api/package.json', 'utf8')).version);")"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
            if [ -z "$VERSION" ]; then
              VERSION="v$(node -e "const fs = require('fs'); process.stdout.write(JSON.parse(fs.readFileSync('apps/api/package.json', 'utf8')).version);")"
            fi
          else
            VERSION="${GITHUB_REF_NAME}"
          fi

          VERSION_NO_V="${VERSION#v}"
          MAJOR="${VERSION_NO_V%%.*}"
          MINOR="$(printf '%s' "$VERSION_NO_V" | cut -d. -f2)"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "version_no_v=${VERSION_NO_V}" >> "$GITHUB_OUTPUT"
          echo "major=${MAJOR}" >> "$GITHUB_OUTPUT"
          echo "minor=${MINOR}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@v4.1.2

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/mathix59/spicytrack-web
          tags: |
            type=raw,value=${{ steps.release.outputs.version }}
            type=raw,value=${{ steps.release.outputs.version_no_v }}
            type=raw,value=${{ steps.release.outputs.major }}.${{ steps.release.outputs.minor }}
            type=raw,value=${{ steps.release.outputs.major }}
            type=sha
            type=raw,value=latest

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/web/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true

      - name: Verify multi-architecture manifest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE: ghcr.io/mathix59/spicytrack-web
        run: |
          docker buildx imagetools inspect "${IMAGE}@${DIGEST}" --raw > /tmp/manifest.json
          jq -e '
            [.manifests[].platform | select(.os == "linux") | .architecture] as $architectures
            | ($architectures | index("amd64")) != null
              and ($architectures | index("arm64")) != null
          ' /tmp/manifest.json

      - name: Sign image digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE: ghcr.io/mathix59/spicytrack-web
        run: cosign sign --yes "${IMAGE}@${DIGEST}"
