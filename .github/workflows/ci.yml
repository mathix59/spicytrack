name: CI

on:
  push:
    branches:
      - main
      - beta
      - develop
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  # A newer push to develop supersedes the previous run, like a pull request update.
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/develop') }}

jobs:
  # Decides which expensive suites a pull request or a push to develop needs, from what changed
  # since its base or the previous push. Pushes to main or beta and manual runs always execute
  # everything.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      k3s: ${{ steps.filter.outputs.k3s }}
      sdk: ${{ steps.filter.outputs.sdk }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect changed areas
        id: filter
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          everything() {
            echo "k3s=true" >> "$GITHUB_OUTPUT"
            echo "sdk=true" >> "$GITHUB_OUTPUT"
            exit 0
          }
          if [ "${EVENT}" = pull_request ]; then
            changed="$(git diff --name-only "${PR_BASE_SHA}...${PR_HEAD_SHA}")"
          elif [ "${EVENT}" = push ] && [ "${REF}" = refs/heads/develop ]; then
            # A new branch or a force push leaves no usable previous commit: run everything.
            git cat-file -e "${PUSH_BEFORE_SHA}^{commit}" 2>/dev/null || everything
            changed="$(git diff --name-only "${PUSH_BEFORE_SHA}" "${GITHUB_SHA}")"
          else
            everything
          fi
          matches() { printf '%s\n' "${changed}" | grep -Eq "$1" && echo true || echo false; }
          echo "k3s=$(matches '^(charts/|e2e/k3s/|scripts/k3s-e2e\.sh|apps/(api|web)/Dockerfile|pnpm-lock\.yaml)')" >> "$GITHUB_OUTPUT"
          echo "sdk=$(matches '^(apps/api/src/(ingest|artifacts)/|e2e/sdk-matrix/|scripts/run-e2e-stack\.mjs|docker-compose\.e2e\.yml|pnpm-lock\.yaml)')" >> "$GITHUB_OUTPUT"

  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: node scripts/run-checks.mjs lint:fast

      - name: Format check
        run: node scripts/run-checks.mjs format:check

      - name: Typecheck
        run: node scripts/run-checks.mjs typecheck

      - name: API unit tests
        run: node scripts/run-checks.mjs test:api

      - name: Web unit tests
        run: node scripts/run-checks.mjs test:web

      - name: Build package tests
        run: node --test packages/build/test/*.test.js

      - name: Build
        run: node scripts/run-checks.mjs build

      - name: Validate operational scripts
        run: |
          node --check scripts/preproduction-smoke.mjs
          node --check scripts/load-ingest.mjs
          pnpm test:release-notes
          node scripts/render-release-notes.mjs "$(node -p "require('./apps/api/package.json').version")" >/tmp/release-notes.md

      - name: Validate local compose files
        env:
          POSTGRES_PASSWORD: ci
          BETTER_AUTH_SECRET: ci
          SECRETS_ENCRYPTION_KEY: ci
          STORAGE_SECRET_ACCESS_KEY: ci
          APP_URL: http://localhost
          PUBLIC_BASE_URL: http://localhost
          WEB_ORIGIN: http://localhost
          WEB_BASE_URL: http://localhost
          BETTER_AUTH_URL: http://localhost/api/better-auth
        run: |
          docker compose -f docker-compose.base.yml -f docker-compose.dev.yml config >/tmp/compose-dev.yml
          docker compose -f docker-compose.base.yml -f docker-compose.prod.yml config >/tmp/compose-prod.yml
          docker compose -f docker-compose.release.yml config >/tmp/compose-release.yml
          docker compose -f docker-compose.paas.yml config >/tmp/compose-paas.yml
          COMPOSE_PROFILES=postgres,storage docker compose -f docker-compose.paas.yml config >/tmp/compose-paas-bundled.yml
          COMPOSE_PROFILES=storage DATABASE_URL=postgresql://ci:ci@database.internal:5432/spicytrack docker compose -f docker-compose.paas.yml config >/tmp/compose-paas-external-db.yml
          COMPOSE_PROFILES=postgres STORAGE_ENDPOINT=https://s3.example.com STORAGE_FORCE_PATH_STYLE=false docker compose -f docker-compose.paas.yml config >/tmp/compose-paas-external-storage.yml

  # Fails on high or critical advisories in any installed package. Fix them with an upgrade or
  # a scoped override in pnpm-workspace.yaml.
  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Audit dependencies
        run: pnpm audit --audit-level high

  k3s-end-to-end:
    runs-on: ubuntu-latest
    needs: [validate, changes]
    if: needs.changes.outputs.k3s == 'true'
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4

      - name: Setup Helm
        uses: azure/setup-helm@v4

      - name: Install k3d
        env:
          K3D_VERSION: v5.9.0
          K3D_LINUX_AMD64_SHA256: 06d8f25bc3a971c4eb29e0ff08429b180402db0f4dec838c9eac427e296800a0
        run: |
          curl --fail --silent --show-error --location \
            "https://github.com/k3d-io/k3d/releases/download/${K3D_VERSION}/k3d-linux-amd64" \
            --output /tmp/k3d
          echo "${K3D_LINUX_AMD64_SHA256}  /tmp/k3d" | sha256sum --check
          sudo install -m 0755 /tmp/k3d /usr/local/bin/k3d

      - name: Run K3s Helm end-to-end test
        env:
          K3S_E2E_TIMEOUT: 10m
          K3S_E2E_BUNDLED_SERVICES: false
        run: bash scripts/k3s-e2e.sh

  docker-build:
    runs-on: ubuntu-latest
    needs: validate
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        target: [api-web, api-ingest, api-worker-admin, web]
        # arm64 is emulated with QEMU and slow: only build it on main, beta and manual runs.
        platform: ${{ fromJSON((github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/develop')) && '["linux/amd64"]' || '["linux/amd64","linux/arm64"]') }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up QEMU
        if: matrix.platform == 'linux/arm64'
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.target == 'web' && 'apps/web/Dockerfile' || 'apps/api/Dockerfile' }}
          # `cond && '' || x` always yields x: an empty string is falsy in expressions.
          target: ${{ matrix.target != 'web' && matrix.target || '' }}
          platforms: ${{ matrix.platform }}
          push: false
          load: ${{ matrix.platform == 'linux/amd64' }}
          tags: spicytrack-${{ matrix.target }}:ci
          cache-from: type=gha,scope=${{ matrix.target }}-${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}-${{ matrix.platform }}

      # The release tarball is checked against the checksums published with it.
      - name: Install Trivy
        if: matrix.platform == 'linux/amd64'
        env:
          TRIVY_VERSION: 0.76.1
        run: |
          base="https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}"
          cd /tmp
          curl --fail --silent --show-error --location --remote-name \
            "${base}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          curl --fail --silent --show-error --location --remote-name \
            "${base}/trivy_${TRIVY_VERSION}_checksums.txt"
          sha256sum --check --ignore-missing "trivy_${TRIVY_VERSION}_checksums.txt"
          tar -xzf "trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" trivy
          sudo install -m 0755 trivy /usr/local/bin/trivy

      # Fails on high or critical vulnerabilities that already have a fix, in the OS packages and
      # the Node.js dependencies shipped in the image.
      # Findings are also reported as an annotation: unlike job logs, annotations of a public
      # repository can be read without signing in.
      - name: Scan image
        if: matrix.platform == 'linux/amd64'
        env:
          IMAGE: spicytrack-${{ matrix.target }}:ci
        run: |
          status=0
          trivy image --no-progress --ignore-unfixed --severity HIGH,CRITICAL \
            --scanners vuln --exit-code 1 --format json --output trivy.json "${IMAGE}" || status=$?
          jq -r '[.Results[]? | .Target as $target | .Vulnerabilities[]?
            | "\(.Severity) \(.VulnerabilityID) \(.PkgName) \(.InstalledVersion) -> \(.FixedVersion) in \($target)"]
            | unique | .[]' trivy.json > findings.txt
          if [ -s findings.txt ]; then
            cat findings.txt
            echo "::error title=Image scan (${IMAGE})::$(head -n 80 findings.txt | awk 'BEGIN { ORS = "%0A" } { gsub(/%/, "%25"); print }')"
          fi
          exit "${status}"

  end-to-end:
    runs-on: ubuntu-latest
    needs: [validate, changes]
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Pull requests and develop only run Chromium; Firefox and WebKit smoke tests run on main
      # and beta.
      - name: Install Playwright browsers
        env:
          BROWSERS: ${{ (github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/develop')) && 'chromium' || 'chromium firefox webkit' }}
        run: pnpm exec playwright install --with-deps ${BROWSERS}

      # The nine-SDK matrix is skipped on pull requests and develop unless ingestion, artifacts
      # or the matrix itself changed.
      - name: Run isolated end-to-end suite
        env:
          E2E_BROWSERS: ${{ (github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/develop')) && 'chromium' || '' }}
          E2E_SKIP_SDK_MATRIX: ${{ needs.changes.outputs.sdk == 'true' && 'false' || 'true' }}
        # On failure, the runner's own error lines (not the services' logs dumped after them)
        # are also reported as an annotation, readable without signing in.
        run: |
          set -o pipefail
          status=0
          pnpm test:e2e 2>&1 | tee e2e.log || status=$?
          if [ "${status}" != 0 ]; then
            sed 's/\x1b\[[0-9;]*m//g' e2e.log \
              | grep -vE '^[[:alnum:]_.-]+[[:space:]]+\| ' \
              | grep -E '\[(resilience|sdk-matrix|load)\]|✘|Error|FAIL|failed|unhealthy|exited|Timed? ?out|Expected|Received' \
              | tail -n 60 > e2e-errors.txt || true
            echo "::error title=End-to-end suite (exit ${status})::$(awk 'BEGIN { ORS = "%0A" } { gsub(/%/, "%25"); print }' e2e-errors.txt)"
          fi
          exit "${status}"

      - name: Upload browser diagnostics
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
