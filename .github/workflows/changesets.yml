name: Version Packages

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: changesets-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version-packages:
    if: ${{ github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create or update release PR
        uses: changesets/action@v1
        id: changesets
        with:
          version: pnpm changeset:version
          commit: "chore(release): version packages"
          title: "chore(release): version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push release tag
        if: ${{ steps.changesets.outputs.hasChangesets == 'false' }}
        id: release
        run: |
          VERSION="v$(node -e "const fs = require('fs'); process.stdout.write(JSON.parse(fs.readFileSync('apps/api/package.json', 'utf8')).version);")"
          if git rev-parse -q --verify "refs/tags/${VERSION}" >/dev/null; then
            echo "Release tag ${VERSION} already exists; skipping."
          else
            pnpm release:tag:push
          fi

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Create or update GitHub release notes
        if: ${{ steps.changesets.outputs.hasChangesets == 'false' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          pnpm release:notes -- "${VERSION#v}" > /tmp/release-notes.md
          if gh release view "${VERSION}" >/dev/null 2>&1; then
            gh release edit "${VERSION}" --title "${VERSION}" --notes-file /tmp/release-notes.md
          else
            gh release create "${VERSION}" --verify-tag --title "${VERSION}" --notes-file /tmp/release-notes.md
          fi

      - name: Publish release images
        if: ${{ steps.changesets.outputs.hasChangesets == 'false' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.release.outputs.version }}
        run: gh workflow run docker-publish.yml --ref main -f version="${VERSION}"
