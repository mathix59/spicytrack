name: Version Packages

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: changesets-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version-packages:
    if: ${{ github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve current release version
        id: current-version
        run: node -p "'version=v' + require('./apps/api/package.json').version" >> "$GITHUB_OUTPUT"

      - name: Create or update release PR
        uses: changesets/action@v1
        id: changesets
        with:
          version: pnpm changeset:version
          commit: "chore(release): version packages"
          title: "chore(release): version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push release tag
        if: ${{ steps.changesets.outputs.hasChangesets == 'false' }}
        id: release
        env:
          VERSION: ${{ steps.current-version.outputs.version }}
        run: |
          if git rev-parse -q --verify "refs/tags/${VERSION}" >/dev/null; then
            echo "Release tag ${VERSION} already exists; skipping."
          else
            pnpm release:tag:push
          fi

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Synchronize GitHub release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CURRENT_VERSION: ${{ steps.current-version.outputs.version }}
        run: |
          for TAG in $(printf '%s\n' "${CURRENT_VERSION}" v1.1.3 | sort -u); do
            VERSION="${TAG#v}"
            if ! node scripts/render-release-notes.mjs "${VERSION}" > /tmp/release-notes.md; then
              echo "No changelog entries for ${TAG}; skipping release notes."
              continue
            fi

            if gh release view "${TAG}" >/dev/null 2>&1; then
              gh release edit "${TAG}" --title "${TAG}" --notes-file /tmp/release-notes.md
            else
              gh release create "${TAG}" --verify-tag --title "${TAG}" --notes-file /tmp/release-notes.md
            fi
          done

      - name: Publish release images
        if: ${{ steps.changesets.outputs.hasChangesets == 'false' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.release.outputs.version }}
        run: gh workflow run docker-publish.yml --ref main -f version="${VERSION}"
