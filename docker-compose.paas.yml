x-api-environment: &api-environment
  DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-spicytrack}:${POSTGRES_PASSWORD:-}@postgres:5432/${POSTGRES_DB:-spicytrack}}
  WEB_ORIGIN: ${APP_URL:?APP_URL is required, for example https://errors.example.com}
  PUBLIC_BASE_URL: ${APP_URL:?APP_URL is required, for example https://errors.example.com}
  INGEST_BASE_URL: ${INGEST_BASE_URL:-}
  WEB_BASE_URL: ${APP_URL:?APP_URL is required, for example https://errors.example.com}
  BETTER_AUTH_URL: ${APP_URL:?APP_URL is required, for example https://errors.example.com}/api/better-auth
  BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET is required}
  AUTH_PASSWORD_ENABLED: ${AUTH_PASSWORD_ENABLED:-true}
  OIDC_DISCOVERY_URL: ${OIDC_DISCOVERY_URL:-}
  OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
  OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
  OIDC_PROVIDER_ID: ${OIDC_PROVIDER_ID:-company-sso}
  OIDC_PROVIDER_NAME: ${OIDC_PROVIDER_NAME:-Company SSO}
  OIDC_ACCESS_MODE: ${OIDC_ACCESS_MODE:-invited}
  OIDC_REQUIRE_VERIFIED_EMAIL: ${OIDC_REQUIRE_VERIFIED_EMAIL:-true}
  OIDC_ACCOUNT_LINKING_ENABLED: ${OIDC_ACCOUNT_LINKING_ENABLED:-true}
  OIDC_AUTO_JOIN_ORGANIZATION_SLUG: ${OIDC_AUTO_JOIN_ORGANIZATION_SLUG:-}
  OIDC_AUTO_JOIN_EMAIL_DOMAINS: ${OIDC_AUTO_JOIN_EMAIL_DOMAINS:-}
  AUTH_SESSION_EXPIRES_IN_SECONDS: ${AUTH_SESSION_EXPIRES_IN_SECONDS:-604800}
  AUTH_SESSION_UPDATE_AGE_SECONDS: ${AUTH_SESSION_UPDATE_AGE_SECONDS:-86400}
  AUTH_RATE_LIMIT_WINDOW_SECONDS: ${AUTH_RATE_LIMIT_WINDOW_SECONDS:-60}
  AUTH_RATE_LIMIT_MAX: ${AUTH_RATE_LIMIT_MAX:-100}
  AUTH_SIGN_IN_RATE_LIMIT_MAX: ${AUTH_SIGN_IN_RATE_LIMIT_MAX:-10}
  ALLOW_PRIVATE_WEBHOOK_URLS: ${ALLOW_PRIVATE_WEBHOOK_URLS:-false}
  VCS_ALLOWED_HOSTS: ${VCS_ALLOWED_HOSTS:-}
  VCS_ALLOW_INSECURE_HTTP: ${VCS_ALLOW_INSECURE_HTTP:-false}
  STORAGE_ENDPOINT: ${STORAGE_ENDPOINT:-http://rustfs:9000}
  STORAGE_REGION: ${STORAGE_REGION:-us-east-1}
  STORAGE_ACCESS_KEY_ID: ${STORAGE_ACCESS_KEY_ID:-spicytrack}
  STORAGE_SECRET_ACCESS_KEY: ${STORAGE_SECRET_ACCESS_KEY:?STORAGE_SECRET_ACCESS_KEY is required}
  STORAGE_BUCKET: ${STORAGE_BUCKET:-spicytrack-artifacts}
  STORAGE_FORCE_PATH_STYLE: ${STORAGE_FORCE_PATH_STYLE:-true}
  INGEST_MAX_EVENT_BYTES: ${INGEST_MAX_EVENT_BYTES:-1000000}
  ARTIFACT_MAX_UPLOAD_BYTES: ${ARTIFACT_MAX_UPLOAD_BYTES:-20971520}
  INGEST_PROJECT_EVENTS_PER_HOUR: ${INGEST_PROJECT_EVENTS_PER_HOUR:-10000}
  INGEST_ORGANIZATION_EVENTS_PER_HOUR: ${INGEST_ORGANIZATION_EVENTS_PER_HOUR:-50000}
  SECRETS_ENCRYPTION_KEY: ${SECRETS_ENCRYPTION_KEY:?SECRETS_ENCRYPTION_KEY is required}

services:
  postgres:
    image: postgres:17-alpine
    profiles: ["postgres"]
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-spicytrack}
      POSTGRES_USER: ${POSTGRES_USER:-spicytrack}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
    volumes:
      - spicytrack_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-spicytrack} -d ${POSTGRES_DB:-spicytrack}",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  rustfs:
    image: ${STORAGE_IMAGE:-rustfs/rustfs:latest}
    profiles: ["storage"]
    restart: unless-stopped
    platform: ${STORAGE_PLATFORM:-linux/amd64}
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ENABLE: "false"
      RUSTFS_ACCESS_KEY: ${STORAGE_ACCESS_KEY_ID:-spicytrack}
      RUSTFS_SECRET_KEY: ${STORAGE_SECRET_ACCESS_KEY:?STORAGE_SECRET_ACCESS_KEY is required}
    volumes:
      - spicytrack_object_data:/data

  api-web:
    image: ${IMAGE_REPOSITORY_PREFIX:-ghcr.io/mathix59/spicytrack}-api-web:${VERSION:-latest}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
        required: false
      rustfs:
        condition: service_started
        required: false
    environment:
      <<: *api-environment
      DATABASE_READ_REPLICA_URL: ${DATABASE_READ_REPLICA_URL:-}
      PORT: 3000
    command:
      [
        "sh",
        "-c",
        "cd apps/api && node node_modules/drizzle-kit/bin.cjs migrate --config drizzle.config.ts && exec node dist/src/main.js",
      ]
    expose:
      - "3000"
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-q",
          "-O",
          "-",
          "http://127.0.0.1:3000/api/health/live",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  api-ingest:
    image: ${IMAGE_REPOSITORY_PREFIX:-ghcr.io/mathix59/spicytrack}-api-ingest:${VERSION:-latest}
    restart: unless-stopped
    depends_on:
      api-web:
        condition: service_healthy
    environment:
      <<: *api-environment
      PORT: 3001
    expose:
      - "3001"
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-q",
          "-O",
          "-",
          "http://127.0.0.1:3001/api/health/live",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  api-worker-admin:
    image: ${IMAGE_REPOSITORY_PREFIX:-ghcr.io/mathix59/spicytrack}-api-worker-admin:${VERSION:-latest}
    restart: unless-stopped
    depends_on:
      api-web:
        condition: service_healthy
    environment: *api-environment

  web:
    image: ${IMAGE_REPOSITORY_PREFIX:-ghcr.io/mathix59/spicytrack}-web:${VERSION:-latest}
    restart: unless-stopped
    depends_on:
      api-web:
        condition: service_healthy
      api-ingest:
        condition: service_healthy
    expose:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  spicytrack_postgres_data:
  spicytrack_object_data:
